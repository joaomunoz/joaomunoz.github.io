profile_job: "Analista de Datos & BI | Licenciado en Ciencias de la Computación"

comment_profile: "Licenciado en Ciencias de la Computación (USACH) con experiencia en bases de datos,
        procesos ETL y operaciones TI 24/7 para clientes de banca y AFP. Hoy me enfoco en el análisis
        de datos y BI: cruzo fuentes con SQL y Python, valido cada cifra con controles automáticos
        de calidad y la convierto en reportes y visualizaciones que respondan preguntas de negocio."

