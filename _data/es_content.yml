Portafolio:
  subject: Portafolio
  listing-order: 0
  class: portfolio
  icon: "/resources/svgs/solid/map.svg"
  contents:
    - title: Radiografía de las carreras y sueldos en Chile
      role: Proyecto personal
      date: Nov. 2026
      image: "/assets/img/carreras-sueldos-chile.webp"
      image_width: 240
      image_height: 236
      image_alt: "Gráfico de cuadrantes: cada carrera según su sueldo al primer año y su crecimiento al quinto, frente a la carrera del medio de su grupo"
      image_link: "https://joaomunoz.github.io/carreras-sueldos-chile/"
      problem: "¿Cuánto gana y qué tan empleable es quien estudia cada carrera, al primer y al quinto año de titulado? Comparé 252 carreras de universidades, IP y CFT con datos de MiFuturo (sueldos registrados en el SII) y las titulaciones del SIES (Mineduc)."
      approach: "Cada carrera se compara solo con otras de su mismo nivel y tipo de institución, y la página avisa cuándo la cifra nacional engaña: en 19 carreras las instituciones difieren 15 puntos o más en empleabilidad (en Trabajo Social, de 52,5% a 74,2%, con una cifra nacional de 66,9%)."
      metrics:
        - value: "252"
          label: carreras comparadas
        - value: "3"
          label: fuentes oficiales (MiFuturo y SIES)
        - value: "81"
          label: controles automáticos de calidad
      stack: [PostgreSQL, SQL, Python]
      stack_extra: [HTML, CSS, JavaScript]
      description:
        - "**Hallazgo:** un crecimiento mayor en porcentaje puede ser menor en pesos. En Ingeniería en Alimentos, quienes llevan cinco años titulados ganan 66,5% más que quienes llevan uno, pero son +$592.205, frente a +$805.627 de la carrera del medio de su grupo."
        - "**Calidad del dato:** todo el cálculo vive en PostgreSQL; los 81 controles detienen la generación si una cifra deja de respaldar lo que muestra la página. La web es un solo archivo que también funciona sin conexión."
      links:
        - label: Ver proyecto en vivo
          url: "https://joaomunoz.github.io/carreras-sueldos-chile/"
          primary: true
        - label: Ver código y metodología
          url: "https://github.com/joaomunoz/carreras-sueldos-chile"

    - title: Mapa Laboral de Chile
      role: Proyecto personal
      date: Oct. - Nov. 2026
      image: "/assets/img/mapa-laboral-chile.webp"
      image_width: 240
      image_height: 1024
      image_alt: "Mapa de Chile coloreado según la actividad económica que distingue a cada región"
      image_link: "https://joaomunoz.github.io/mapa-laboral-chile/"
      problem: "¿Cómo es la situación laboral y educacional de Chile por región y actividad económica? Mapa interactivo que cruza el Censo 2024, la Encuesta Nacional de Empleo (INE), la CASEN 2024 y datos del Mineduc (SIES y MiFuturo)."
      approach: "El proyecto nació para calcular la probabilidad de empleo de cada carrera por región. Al medir los datos vi que no era posible (de 3.040 combinaciones de carrera y región, solo 62 eran fiables), así que cambié la pregunta en vez de inventar la cifra."
      # 15,2 M = personas de 15 años o más en la capa principal (Censo 2024), según el README del repo.
      metrics:
        - value: "5"
          label: fuentes oficiales cruzadas
        - value: "15,2 M"
          label: personas en la capa principal (Censo 2024)
        - value: "106"
          label: controles automáticos de calidad
        - value: "0,08%"
          label: desviación máxima frente a los boletines del INE
      stack: [Python, pandas, GeoPandas]
      stack_extra: [HTML, CSS, JavaScript]
      description:
        - "**Hallazgo:** el 24,2% de los adultos mayores de Aysén trabaja, la tasa más alta del país (17,5% en Chile)."
        - "**Calidad del dato:** validé el procesamiento contra los boletines oficiales del INE; los 106 controles detienen la generación si un dato deja de respaldar lo que muestra la página."
      links:
        - label: Ver proyecto en vivo
          url: "https://joaomunoz.github.io/mapa-laboral-chile/"
          primary: true
        - label: Ver código y metodología
          url: "https://github.com/joaomunoz/mapa-laboral-chile"

