Experiencia:
  subject: Experiencia
  listing-order: 2
  class: experience
  icon: "/assets/img/briefcase.svg"
  contents:
    - title: Especialización en Análisis de Datos y Proyectos Independientes
      role: Formación y proyectos propios
      date: Ago. 2024 - Actualidad
      description:
        - "Completé el Google Data Analytics Professional Certificate (Beca Talento Digital para Chile): limpieza, análisis y visualización de datos, de la pregunta de negocio a la presentación de resultados."
        - "Desarrollé dos proyectos end-to-end con datos públicos chilenos (Censo, INE, CASEN, Mineduc), desde la ingesta hasta la publicación web, con PostgreSQL, SQL y Python (pandas, GeoPandas)."
        - "Apliqué validación contra cifras oficiales y controles automáticos de calidad que detienen la generación si un dato deja de respaldar lo publicado (ver Portafolio)."

    - title: IBM
      role: Operador de Procesos y Command Center
      date: Ago. 2023 - Jul. 2024
      description:
        - "Participé en el desarrollo del dashboard del Command Center en Power BI, integrado en Microsoft Teams con SharePoint y documentos Excel como fuente de datos, que reunió en un solo lugar la medición de eficacia operativa y el reporte de escalamientos por cliente."
        - "Creé un flujo en Power Automate que extraía los sub-reportes desde correos de Outlook y los unificaba automáticamente en un único reporte consolidado por horario de salida, en lugar de armarlo a mano."
        - "Mantuve reportes de incidentes segmentados por unidad operativa (BBDD, UNIX, WINTEL, WAS, Networking y SAP) con seguimiento en Jira, gestionando escalamientos internos y externos según la criticidad del servicio."
        - "Monitoreé redes, plataformas y servicios con Nagios, Tivoli, Zabbix y VZOR para múltiples clientes simultáneos en banca (Itaú, Security, Santander), AFP (Hábitat, SURA), cajas de compensación (Los Héroes) e industria (AZA)."
        - "Ejecuté procesos nocturnos y batch, y administré respaldos con EMC NetWorker y TSM en infraestructuras críticas."
        - "Administré accesos y perfiles de usuario, ejecuté mantenimiento de plataformas y aseguré la continuidad de servicios críticos en operación 24/7."

    - title: M y CH Inmobiliaria
      role: Gestión Inmobiliaria, Control Operativo y Obras
      date: Sep. 2020 - Ene. 2023
      description:
        - "Controlé la recaudación de arriendos y el seguimiento operativo de cada propiedad en una empresa familiar de compra, venta y construcción de propiedades."
        - "Administré la mantención de los servicios básicos de las propiedades."
        - "Apoyé directamente la ejecución de obras de construcción."

    # Pendiente de confirmar: si fue contrato a plazo fijo o práctica, cambiar "proyecto de 3 meses".
    - title: G-Talent
      role: Analista Programador (proyecto de 3 meses)
      date: Sep. - Nov. 2019
      description:
        - "Desarrollé reportes de gestión empresarial en SQL Server mediante procedimientos almacenados, estructurando consultas para la extracción y transformación de datos operativos."
        - "Generé reportes de auditoría interna y control de gestión en Oracle, entregando información consolidada para la toma de decisiones."
        - "Desarrollé un pipeline ETL completo en SSIS con SQL Server para el reporte de contabilidad de clientes de VTR, automatizando la extracción, transformación y carga de los datos de facturación."

    - title: "Medicien: Proyecto Portal Paciente"
      role: Analista Programador (proyecto de 3 meses)
      date: Jun. - Ago. 2019
      description:
        - "Diseñé y desarrollé la base de datos PortalPaciente en SQL Server para el registro de citas médicas, la gestión de agenda de dentistas y el control del servicio de odontología."
        - "Implementé la automatización ETL en Pentaho, con integración vía API y tokens de seguridad, para extraer datos del servicio de odontología hacia la base de datos."
        - "Administré la interoperabilidad de datos entre los motores Oracle Horizon y SQL Server."

