Experiencia:
  subject: Experiencia
  listing-order: 4
  class: experience
  icon: "/assets/img/briefcase.svg"
  contents:
    - title: Kyndryl / IBM
      role: Operador de Procesos y Command Center
      description:
        - Monitoreé y supervisé redes, plataformas y servicios con Nagios, Tivoli, Zabbix y VZOR para múltiples clientes simultáneos en banca (Itaú, Security, Santander), AFP (Hábitat, SURA), cajas de compensación (Los Héroes) e industria (AZA).
        - Mantuve reportes de incidentes segmentados por unidad operativa (BBDD, UNIX, WINTEL, WAS, Networking y SAP) con seguimiento en Jira, gestionando escalamientos internos y externos según criticidad del servicio.
        - Participé en el desarrollo del dashboard del Command Center en Power BI, integrado en Microsoft Teams con SharePoint como fuente de datos mediante documentos Excel, para medición de eficacia operativa y reporte de escalamientos por cliente.
        - Creé flujo en Power Automate que extraía sub-reportes desde correos Outlook y los unificaba automáticamente en un único reporte consolidado por horarios de salida.
        - Ejecuté procesos nocturnos/batch y administré respaldos con EMC NetWorker y TSM en infraestructuras críticas.
        - Administré accesos y perfiles de usuario, ejecuté mantenimiento de plataformas y aseguré la continuidad de servicios críticos en entorno 24/7.
      date: Ago. 2023 - Jul. 2024

    - title: M y CH Inmobiliaria
      role: Gestión y Obras
      description:
        - Empresa familiar dedicada a la compra/venta y construcción de propiedades. 
          Me desempeñé como obrero de la construcción y encargado de gestión inmobiliaria, 
          con responsabilidades directas en la recaudación de arriendos y 
          la mantención de servicios básicos de cada propiedad.
      date: Sep. 2020 - Ene. 2023

    - title: G-Talent
      role: Analista Programador
      description:
        - Desarrollé reportes de gestión empresarial con SQL Server mediante Procedimientos Almacenados, estructurando consultas para extracción y transformación de datos operativos.
        - Generé reportes de auditoría interna y control de gestión usando Oracle, entregando información consolidada para toma de decisiones.
        - Desarrollé pipeline ETL completo en SSIS con SQL Server para el reporte de contabilidad de clientes de VTR, automatizando la extracción, transformación y carga de datos de facturación.
      date: Sep. - Nov. 2019

    - title: "Medicien: Proyecto Portal Paciente"
      role: Analista Programador
      description:
        - Diseñé y desarrollé la base de datos PortalPaciente en SQL Server para registro de citas médicas, gestión de agenda de dentistas y control del servicio de odontología.
        - Implementé automatización ETL en Pentaho con integración vía API y tokens de seguridad para extracción de datos desde el servicio de odontología hacia la base de datos.
        - Administré interoperabilidad de datos entre motores Oracle Horizon y SQL Server.
      date: Jun. - Ago. 2019
