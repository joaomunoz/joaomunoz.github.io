Portafolio:
  subject: Portfolio
  listing-order: 0
  class: portfolio
  icon: "/resources/svgs/solid/map.svg"
  contents:
    - title: Chile Degrees and Salaries Snapshot
      role: Personal project
      date: Nov. 2026
      image: "/assets/img/carreras-sueldos-chile.webp"
      image_width: 240
      image_height: 236
      image_alt: "Quadrant chart: each degree by its first-year salary and its growth by year five, against the median degree of its group"
      image_link: "https://joaomunoz.github.io/carreras-sueldos-chile/"
      problem: "How much do graduates of each degree earn, and how employable are they, one and five years after graduating? I compared 252 degrees from universities, professional institutes and technical training centers, using MiFuturo data (earnings recorded by the tax service, SII) and SIES graduation records (Ministry of Education)."
      approach: "Each degree is compared only with others of the same level and institution type, and the page flags when the national figure is misleading: in 19 degrees, institutions differ by 15 points or more in employment rate (in Social Work, from 52.5% to 74.2%, against a national figure of 66.9%)."
      metrics:
        - value: "252"
          label: degrees compared
        - value: "3"
          label: official sources (MiFuturo and SIES)
        - value: "81"
          label: automated quality checks
      stack: [PostgreSQL, SQL, Python]
      stack_extra: [HTML, CSS, JavaScript]
      description:
        - "**Finding:** higher growth in percentage terms can be lower growth in pesos. In Food Engineering, graduates five years out earn 66.5% more than those one year out, but that is +CLP 592,205, against +CLP 805,627 for the median degree of its group."
        - "**Data quality:** all calculations live in PostgreSQL; the 81 checks stop the build if any figure no longer supports what the page shows. The site is a single file that also works offline."
      links:
        - label: View live project (in Spanish)
          url: "https://joaomunoz.github.io/carreras-sueldos-chile/"
          primary: true
        - label: View code and methodology
          url: "https://github.com/joaomunoz/carreras-sueldos-chile"

    - title: Chile Labor Map
      role: Personal project
      date: Oct. - Nov. 2026
      image: "/assets/img/mapa-laboral-chile.webp"
      image_width: 240
      image_height: 1024
      image_alt: "Map of Chile colored by the economic activity that sets each region apart"
      image_link: "https://joaomunoz.github.io/mapa-laboral-chile/"
      problem: "What does Chile's labor and education landscape look like by region and economic activity? An interactive map that joins the 2024 Census, the National Employment Survey (INE), the 2024 CASEN survey and Ministry of Education data (SIES and MiFuturo)."
      approach: "The project started as an attempt to estimate each degree's employment probability by region. Measuring the data showed it was not possible (only 62 of 3,040 degree-by-region combinations were reliable), so I changed the question instead of inventing the number."
      # 15.2 M = people aged 15+ in the main layer (2024 Census), per the repo README.
      metrics:
        - value: "5"
          label: official sources joined
        - value: "15.2 M"
          label: people in the main layer (2024 Census)
        - value: "106"
          label: automated quality checks
        - value: "0.08%"
          label: maximum deviation from INE official bulletins
      stack: [Python, pandas, GeoPandas]
      stack_extra: [HTML, CSS, JavaScript]
      description:
        - "**Finding:** 24.2% of older adults in Aysén work, the highest rate in the country (17.5% nationwide)."
        - "**Data quality:** validated the processing against INE's official bulletins; the 106 checks stop the build if any figure no longer supports what the page shows."
      links:
        - label: View live project (in Spanish)
          url: "https://joaomunoz.github.io/mapa-laboral-chile/"
          primary: true
        - label: View code and methodology
          url: "https://github.com/joaomunoz/mapa-laboral-chile"

