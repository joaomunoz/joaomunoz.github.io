  icon: "/assets/img/briefcase.svg"
  contents:
    - title: IBM
      role: IT Process and Command Center Operator
      description:
        - Monitored networks, platforms and services with Nagios, Tivoli, Zabbix and VZOR for multiple simultaneous clients in banking (Itaú, Security, Santander), pension funds (Hábitat, SURA), compensation funds (Los Héroes) and industry (AZA).
        - Maintained incident reports segmented by operational unit (BBDD, UNIX, WINTEL, WAS, Networking and SAP) with Jira tracking, managing internal and external escalations based on service criticality.
        - Participated in the development of the Command Center dashboard in Power BI, integrated into Microsoft Teams with SharePoint as data source via Excel documents, for operational efficiency measurement and client escalation reporting.
        - Built a Power Automate flow that extracted sub-reports from Outlook emails and automatically consolidated them into a single report based on output schedules.
        - Executed nightly/batch processes and managed backups with EMC NetWorker and TSM in critical infrastructures.
        - Managed user access and profiles, performed platform maintenance and ensured continuity of critical services in a 24/7 environment.
      date: Aug. 2023 - Jul. 2024

    - title: M y CH Inmobiliaria
      role: Real Estate Management and Construction
      description:
        - Family-owned real estate and construction company. 
          Worked as a construction worker and real estate manager, 
          with direct responsibilities in rent collection and basic utilities 
          maintenance for each property.
      date: Sep. 2020 - Jan. 2023

    - title: G-Talent
      role: Programmer Analyst
      description:
        - Developed business management reports with SQL Server using Stored Procedures, structuring queries for extraction and transformation of operational data.
        - Generated internal audit and management control reports using Oracle, delivering consolidated information for decision-making.
        - Developed a complete ETL pipeline in SSIS with SQL Server for the billing report of VTR customers, automating the extraction, transformation and loading of billing data.
      date: Sep. - Nov. 2019

    - title: "Medicien: Patient Portal Project"
      role: Programmer Analyst
      description:
        - Designed and developed the PortalPaciente database in SQL Server for medical appointment registration, dentist schedule management and dental service control.
        - Implemented ETL automation in Pentaho with API integration and security tokens for data extraction from the dental service to the database.
        - Managed data interoperability between Oracle Horizon and SQL Server engines.
      date: Jun. - Aug. 2019
